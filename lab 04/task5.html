<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab 04 - Task 5: Campus Photos</title>
  <link href="css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <main class="container my-4">
    <section class="border p-3 p-md-4">
      <h1 class="h3 text-center mb-3">Campus Photos</h1>
      <div class="row g-3 text-center">
        <figure class="col-6 col-md-4 mb-0">
          <img class="img-fluid rounded shadow-sm" src="maingate.jfif" alt="University main gate" loading="lazy">
          <figcaption class="small mt-1">Main gate</figcaption>
        </figure>
        <figure class="col-6 col-md-4 mb-0">
          <img class="img-fluid rounded shadow-sm" src="library.jfif" alt="University library" loading="lazy">
          <figcaption class="small mt-1">Library</figcaption>
        </figure>
        <figure class="col-6 col-md-4 mb-0">
          <img class="img-fluid rounded shadow-sm" src="photos/robotics-lab.jpg" alt="Student working in an engineering lab" loading="lazy">
          <figcaption class="small mt-1">Engineering lab</figcaption>
        </figure>
        <figure class="col-6 col-md-4 mb-0">
          <img class="img-fluid rounded shadow-sm" src="labs.jpg" alt="Computer lab with students at their workstations" loading="lazy">
          <figcaption class="small mt-1">Computer lab</figcaption>
        </figure>
        <figure class="col-6 col-md-4 mb-0">
          <img class="img-fluid rounded shadow-sm" src="photos/lake-sunset.jpg" alt="Sunset over mountain ranges" loading="lazy">
          <figcaption class="small mt-1">Mountain sunset</figcaption>
        </figure>
        <figure class="col-6 col-md-4 mb-0">
          <img class="img-fluid rounded shadow-sm" src="graduation.jfif" alt="Graduation day" loading="lazy">
          <figcaption class="small mt-1">Graduation day</figcaption>
        </figure>
      </div>

      <h2 class="h4 mt-4 mb-3">Photo Team</h2>
      <div class="row g-3">
        <div class="col-12 col-md-6">
          <div class="d-flex align-items-center gap-3">
            <img class="rounded-circle" src="photos/team-lead.jpg" width="72" height="72" alt="Photo team lead portrait" loading="lazy">
            <div>
              <h3 class="h6 mb-1">Ayesha Khan</h3>
              <p class="small text-secondary mb-0">Team lead, took most of the campus photos.</p>
            </div>
          </div>
        </div>
        <div class="col-12 col-md-6">
          <div class="d-flex align-items-center gap-3">
            <img class="img-thumbnail" src="photos/team-editor.jpg" width="56" height="72" alt="Photo team editor portrait" loading="lazy">
            <div>
              <h3 class="h6 mb-1">Bilal Ahmed</h3>
              <p class="small text-secondary mb-0">Edited the pictures for the website.</p>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>
  <script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
