<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab 05 - Task 2: Course Enrollment</title>
  <link href="css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg bg-dark" data-bs-theme="dark">
    <div class="container">
      <a class="navbar-brand" href="task5.html">UW CS Society</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
        aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="task5.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="task5.html#events">Events</a></li>
          <li class="nav-item"><a class="nav-link" href="task3_register.html">Members</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Gallery</a></li>
          <li class="nav-item"><a class="nav-link" href="task5.html#contact">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-4">
    <h1 class="h3 mb-4">Course Enrollment Form</h1>
    <form class="row g-3">
      <div class="col-md-6">
        <label for="firstName" class="form-label">First Name</label>
        <input type="text" class="form-control" id="firstName" name="firstName" required>
      </div>
      <div class="col-md-6">
        <label for="lastName" class="form-label">Last Name</label>
        <input type="text" class="form-control" id="lastName" name="lastName" required>
      </div>
      <div class="col-md-8">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" name="email" required>
      </div>
      <div class="col-md-4">
        <label for="year" class="form-label">Year</label>
        <select class="form-select" id="year" name="year" required>
          <option value="" selected disabled>Choose...</option>
          <option value="1">Year 1</option>
          <option value="2">Year 2</option>
          <option value="3">Year 3</option>
          <option value="4">Year 4</option>
        </select>
      </div>
      <div class="col-12">
        <label for="course" class="form-label">Course</label>
        <input type="text" class="form-control" id="course" name="course"
          list="courseList" placeholder="Start typing a course name..." required>
        <datalist id="courseList">
          <option value="Web Application Development"></option>
          <option value="Database Systems"></option>
          <option value="Artificial Intelligence"></option>
          <option value="Computer Networks"></option>
        </datalist>
      </div>
      <div class="col-md-6">
        <label for="rollNumber" class="form-label">Roll Number (read-only)</label>
        <input type="text" class="form-control" id="rollNumber" name="rollNumber"
          value="FA24-BCS-????" readonly>
      </div>
      <div class="col-md-6">
        <label for="feeCode" class="form-label">Fee Code (small input)</label>
        <input type="text" class="form-control form-control-sm" id="feeCode" name="feeCode"
          placeholder="e.g. F2026-A">
      </div>
      <div class="col-12">
        <button type="submit" class="btn btn-primary">Submit</button>
        <button type="reset" class="btn btn-outline-secondary">Clear</button>
      </div>
    </form>
  </main>

  <script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
