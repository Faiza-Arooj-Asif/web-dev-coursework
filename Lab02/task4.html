<html>
    <head>
        <title>Task 4 - Patient Registration</title>
    </head>
    <body>
        <h1>Patient Registration</h1>

        <form>
            <fieldset>
                <legend>Personal Information</legend>

                <label for="full-name">Full Name:</label>
                <input type="text" id="full-name" name="full_name" placeholder="As on your ID">
                <br><br>

                <label for="date-of-birth">Date of Birth:</label>
                <input type="date" id="date-of-birth" name="date_of_birth">
                <br><br>

                Gender:
                <input type="radio" id="gender-male" name="gender" value="male" checked>
                <label for="gender-male">Male</label>
                <input type="radio" id="gender-female" name="gender" value="female">
                <label for="gender-female">Female</label>
                <input type="radio" id="gender-other" name="gender" value="other">
                <label for="gender-other">Other</label>
                <br><br>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email">
                <br><br>

                <label for="password">Password:</label>
                <input type="password" id="password" name="password">
                <br><br>
            </fieldset>

            <fieldset>
                <legend>Medical Details</legend>

                <label for="blood-group">Blood Group:</label>
                <select id="blood-group" name="blood_group">
                    <option value="">-- Select --</option>
                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                </select>
                <br><br>

                <label for="weight">Weight (kg):</label>
                <input type="number" id="weight" name="weight" min="1" max="300">
                <br><br>

                Known Allergies:
                <input type="checkbox" id="allergy-dust" name="allergies" value="dust">
                <label for="allergy-dust">Dust</label>
                <input type="checkbox" id="allergy-pollen" name="allergies" value="pollen">
                <label for="allergy-pollen">Pollen</label>
                <input type="checkbox" id="allergy-penicillin" name="allergies" value="penicillin">
                <label for="allergy-penicillin">Penicillin</label>
                <br><br>

                <label for="medicines">Current Medicines (hold Ctrl):</label>
                <br>
                <select id="medicines" name="medicines" multiple size="3">
                    <option value="paracetamol">Paracetamol</option>
                    <option value="insulin">Insulin</option>
                    <option value="aspirin">Aspirin</option>
                </select>
                <br><br>

                <label for="registration-date">Registration Date:</label>
                <input type="date" id="registration-date" name="registration_date" value="2026-10-10">
                <br><br>

                <label for="patient-id">Patient ID:</label>
                <input type="text" id="patient-id" name="patient_id" value="Assigned by hospital" disabled>
            </fieldset>

            <fieldset>
                <legend>Appointment</legend>

                <label for="department">Department:</label>
                <select id="department" name="department">
                    <option value="cardiology" selected>Cardiology</option>
                    <option value="neurology">Neurology</option>
                    <option value="orthopedics">Orthopedics</option>
                    <option value="dermatology">Dermatology</option>
                </select>
                <br><br>

                <label for="urgency">Urgency (1-5):</label>
                <input type="range" id="urgency" name="urgency" min="1" max="5" value="3">
                <br><br>

                <label for="symptoms">Symptoms:</label>
                <br>
                <textarea id="symptoms" name="symptoms" rows="5" cols="50" placeholder="Describe your symptoms"></textarea>
                <br><br>

                <input type="checkbox" id="confirm" name="confirm" value="yes">
                <label for="confirm">I confirm the information above is correct</label>
                <br><br>
            </fieldset>

            <input type="submit" value="Register Patient">
            <input type="reset" value="Reset">
        </form>
    </body>
</html>
